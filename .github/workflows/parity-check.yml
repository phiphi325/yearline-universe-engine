# =============================================================================
# Parity check (manual / workflow_dispatch) — Tiingo vs the committed Yahoo cache.
# Run this ONCE before enabling the nightly `schedule:` (and any time you re-validate the provider).
# It uses the TIINGO_API_KEY repo secret, so there's nothing to install locally.
#
# Pass  → step exits 0, run is green ("PARITY OK ...").
# Fail  → step exits 1, run is red  ("PARITY FAILED for: [...]") — read the table in the log;
#         the usual cause is a dividend-adjustment difference vs the (older) cache.
#
# Add this file at .github/workflows/parity-check.yml on main, then: Actions tab → "parity-check"
# → "Run workflow". Educational research only; must_not_auto_execute.
# =============================================================================
name: parity-check

on:
  workflow_dispatch:
    inputs:
      config:
        description: "Universe config to check"
        required: false
        default: "config/universe_mega_cap_ai_infra.yaml"
        type: string
      tolerance_pp:
        description: "Max allowed distance-to-MA250 divergence at the latest common bar (pp)"
        required: false
        default: "0.25"
        type: string

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[live]"     # clean runner Python — no externally-managed-environment issue

      - name: Parity check (Tiingo adjusted close vs the committed cache)
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
        run: |
          python scripts/parity_check.py "${{ inputs.config }}" --tolerance-pp "${{ inputs.tolerance_pp }}"
