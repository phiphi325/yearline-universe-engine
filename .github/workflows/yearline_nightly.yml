# =============================================================================
# yearline nightly producer — ACTIVE (manual / workflow_dispatch). V13.9.
# -----------------------------------------------------------------------------
# Manual-only for now: the `schedule:` trigger stays commented until a `TIINGO_API_KEY`
# secret is configured (Settings → Secrets and variables → Actions). The entrypoint
# (scripts/run_nightly.py) and CI (ci.yml) are both in, and OM-Y2 (consumer ingest) is
# verified on live Postgres — so the secret is the last gate before scheduling.
#
# Data source: Tiingo (adjusted daily EOD; keyed, not IP-blocked like Yahoo). The provider
# chain falls back to yfinance → yahoo_chart if Tiingo is unavailable. No key ⇒ run_nightly's
# pre-flight will report a fetch failure (set the secret first). Reference + the AV/Tiingo/Polygon/
# EOD comparison: docs/reference/data_providers.md.
#
# Before scheduling, run the parity check once: TIINGO_API_KEY=… python scripts/parity_check.py
# (Tiingo adjusted close vs the committed Yahoo cache; must pass before you trust the swap).
#
# Hard rules:
#   • idempotent publish (artifacts keyed {ticker}_{as_of}; re-runs overwrite)
#   • market-calendar aware (run_nightly's pre-flight emits available:false on a no-new-bar day)
#   • schema-validate BEFORE publishing (scripts/validate_contract_fixtures.py) — don't poison the feed
#   • the schedule is for DATA freshness only — it must NEVER bump adapter_version / series_version
#   • educational research only; every surface stays must_not_auto_execute
# Enablement checklist: docs/phased_design/phase_09/option_mgmt_handoff.md §10.
# =============================================================================
name: yearline-nightly

on:
  workflow_dispatch:            # manual-first: run a specific as_of on demand (demo / backfill)
    inputs:
      as_of:
        description: "Data date to score (YYYY-MM-DD). Blank = latest available bar."
        required: false
        type: string
  # ---------------------------------------------------------------------------
  # ENABLE ONLY AFTER the TIINGO_API_KEY secret is set + parity_check.py passes:
  # schedule:
  #   - cron: "30 6 * * 2-6"    # ~01:30 ET Tue–Sat (after the US close + data settle); UTC.
  #                              # Tue–Sat covers Mon–Fri sessions; run_nightly's guard handles holidays.
  # ---------------------------------------------------------------------------

permissions:
  contents: read                # bump to `write` only if you publish to a data branch / release asset

concurrency:                    # never let two nightly runs race on the same artifact
  group: yearline-nightly
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[live]"     # base (incl. requests) + yfinance/curl_cffi fallback providers
          pip install jsonschema       # used by the validate step

      - name: Produce the envelopes + trend series (pooled universe; gated contract)
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
        run: |
          # run_nightly: pre-flight freshness guard → pooled run (surface_blend + surface_success +
          # pool_hazard + calibrate) → per-ticker export_yearline_context + export_yearline_trend_series,
          # keyed {ticker}_{as_of}; writes yearline_run_status_{run_date}.json (available true/false).
          ARGS="--provider tiingo --out exports/yearline_context"
          if [ -n "${{ inputs.as_of }}" ]; then ARGS="$ARGS --as-of ${{ inputs.as_of }}"; fi
          python scripts/run_nightly.py $ARGS

      - name: Validate emitted artifacts against the pinned schemas BEFORE publishing
        run: python scripts/validate_contract_fixtures.py   # fails the run (skips publish) on any drift

      - name: Publish the artifact (loosest option = upload-artifact; zero new infra)
        uses: actions/upload-artifact@v4
        with:
          name: yearline-context-${{ inputs.as_of || 'latest' }}
          path: exports/yearline_context/*.json
          if-no-files-found: error
          retention-days: 30
      # Alternatives as you graduate (see two_repo_strategy §3): a GitHub Release asset / small data
      # branch (git-auditable, zero infra), object storage (S3/GCS/R2), or — now that OM-Y2's
      # `yearline_context` table exists — an idempotent upsert into option-mgmt's Neon Postgres
      # ("the latest row", matching inputs_hydration_service.py). Start with the loosest.
